name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Call Gemini API and post review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          with open("pr_diff.txt") as f:
              diff = f.read()

          # 토큰 초과 방지 (약 30KB 제한)
          if len(diff) > 30000:
              diff = diff[:30000] + "\n...(diff truncated)"

          if not diff.strip():
              print("diff 없음, 스킵")
              exit(0)

          prompt = (
              "다음 PR diff를 코드 리뷰해줘. 한국어로 작성하고, 아래 항목 중심으로 간결하게:\n"
              "- 버그 또는 로직 오류\n"
              "- 보안 이슈 (인증 누락, 민감 정보 노출 등)\n"
              "- 개선 제안\n"
              "- 잘 된 점\n\n"
              "```diff\n" + diff + "\n```"
          )

          payload = json.dumps({
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"maxOutputTokens": 2048}
          }).encode()

          api_key = os.environ["GEMINI_API_KEY"]
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"

          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read())

          review = result["candidates"][0]["content"]["parts"][0]["text"]
          body = f"## 🤖 Gemini PR Review\n\n{review}\n\n---\n*Powered by Gemini 2.5 Flash (free tier)*"

          with open("review_body.txt", "w") as f:
              f.write(body)
          EOF

          if [ -f review_body.txt ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file review_body.txt
          fi
